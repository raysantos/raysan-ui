<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>New Project</title>

  <!-- 1. No light flash on dark: must come before the CSS -->
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>

  <!-- 2. Fonts and icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Sofia+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <!-- 3. raysan-ui (pinned to 0.1.x: fixes arrive automatically, breaking changes don't) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/raysantos/raysan-ui@0.1/css/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/raysantos/raysan-ui@0.1/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/raysantos/raysan-ui@0.1/css/components.css">
  <script src="https://cdn.jsdelivr.net/gh/raysantos/raysan-ui@0.1/js/theme-toggle.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/raysantos/raysan-ui@0.1/js/scroll-progress.js" defer></script>

  <!-- 4. This project's brand overrides and own styles (optional) -->
  <!-- <link rel="stylesheet" href="theme.css"> -->
  <!-- <link rel="stylesheet" href="app.css"> -->
</head>
<body>
  <a class="skip btn btn-filled" href="#main">Skip to content</a>

  <header class="top-app-bar">
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="wrap">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>New Project</a>
      <theme-toggle></theme-toggle>
    </div>
  </header>

  <main id="main" class="wrap stack" style="padding-block: 48px;">
    <p class="overline">Project</p>
    <h1 class="display-m">Start building here</h1>
    <p class="body-l muted">Everything on this page comes from raysan-ui. Add your own CSS in app.css, using tokens instead of hard-coded colors.</p>
    <div class="row">
      <a class="btn btn-filled" href="#"><span class="ms" aria-hidden="true">add</span>Primary action</a>
      <a class="btn btn-outlined" href="#">Secondary</a>
    </div>
  </main>
</body>
</html>
